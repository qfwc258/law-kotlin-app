name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_GRADLE_PLUGIN_VERSION: 8.2.2
  GRADLE_VERSION: 8.5
  # 签名配置（生产环境建议在 GitHub Secrets 中配置后覆盖）
  SIGNING_STORE_FILE: release/law-app-release.keystore
  SIGNING_STORE_PASSWORD: LawApp2026
  SIGNING_KEY_ALIAS: law-app
  SIGNING_KEY_PASSWORD: LawApp2026

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: law-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate signing config
        run: |
          cat > local.properties << 'SIGNING_EOF'
          storeFile=release/law-app-release.keystore
          storePassword=LawApp2026
          keyAlias=law-app
          keyPassword=LawApp2026
          SIGNING_EOF
          echo "=== local.properties generated ==="
          cat local.properties

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK path: $APK_PATH"
          ls -la "$APK_PATH"
          echo "=== APK info ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH" 2>/dev/null | head -5 || echo "aapt not available"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: law-app-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Release Mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 90
