name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ANDROID_GRADLE_PLUGIN_VERSION: 8.2.2
  GRADLE_VERSION: 8.5
  # 签名配置（生产环境建议在 GitHub Secrets 中配置后覆盖）
  SIGNING_STORE_FILE: release/law-app-release.keystore
  SIGNING_STORE_PASSWORD: LawApp2026
  SIGNING_KEY_ALIAS: law-app
  SIGNING_KEY_PASSWORD: LawApp2026

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate signing config
        run: |
          cat > local.properties << 'SIGNING_EOF'
          storeFile=release/law-app-release.keystore
          storePassword=LawApp2026
          keyAlias=law-app
          keyPassword=LawApp2026
          SIGNING_EOF
          echo "=== local.properties generated ==="
          cat local.properties

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK path: $APK_PATH"
          ls -la "$APK_PATH"
          echo "=== APK info ==="
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging "$APK_PATH" 2>/dev/null | head -5 || echo "aapt not available"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: law-app-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Commit APK to release folder
        run: |
          # 配置 git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 创建 release 目录（如果不存在）
          mkdir -p release
          
          # 找到生成的 APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK path: $APK_PATH"
          
          if [ -n "$APK_PATH" ]; then
            # 获取版本号和日期
            VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle.kts 2>/dev/null || echo "1.0.0")
            DATE=$(date +%Y%m%d)
            APK_NAME="法律宝典-v${VERSION_NAME}-${DATE}.apk"
            
            # 复制 APK 到 release 目录
            cp "$APK_PATH" "release/$APK_NAME"
            echo "APK copied to: release/$APK_NAME"
            ls -la release/
            
            # 提交并推送（使用 [skip ci] 避免无限循环）
            git add -f "release/$APK_NAME"
            git commit -m "ci: 自动提交APK到release目录 [skip ci]

            APK: $APK_NAME
            版本: $VERSION_NAME
            日期: $DATE
            构建: ${{ github.run_number }}" || echo "No changes to commit"
            
            # 推送到当前分支
            CURRENT_BRANCH="${{ github.ref_name }}"
            echo "Pushing to branch: $CURRENT_BRANCH"
            git push origin "HEAD:$CURRENT_BRANCH" || echo "Push failed or no changes"
          else
            echo "APK not found"
          fi

      - name: Upload Release Mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 90
